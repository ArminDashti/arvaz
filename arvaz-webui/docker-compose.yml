name: arvaz
services:
  arvaz-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-arvaz-webui:latest}
    container_name: arvaz-webui
    expose:
      - "80"
    environment:
      API_HOST: ${API_HOST:-172.23.0.1}
      API_PORT: ${API_PORT:-8090}
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true
